name: bazzora
description: Image Bazzite-GNOME debloatée et optimisée pour PC Gaming Full AMD.
base-image: ghcr.io/ublue-os/bazzite-gnome
# Version Fedora suivie : « stable-<N> » reçoit chaque jour les mises à jour de Bazzite pour Fedora N,
# sans jamais changer de version majeure. Pour passer à Fedora N+1, modifier ce tag dans une PR :
# la CI (image de comparaison des tests) et l'ISO lisent cette valeur, rien d'autre n'est à changer.
image-version: stable-45

# Les builds sont publiés sous le tag « candidate » uniquement.
# Le workflow CI les teste, puis promeut l'image validée en « latest » (voir .github/workflows/build.yml).
alt-tags:
  - candidate

modules:
  # 1. Copie des configurations et fichiers personnalisés (/etc, /usr, environment.d, etc.)
  - type: files
    files:
      - source: system
        destination: /

  # 2. Paquets RPM : ajout de Starship, LACT, GParted, Papirus ; retrait ciblé
  # Module dnf : depuis Fedora 45, rpm-ostree refuse de s'exécuter pendant un build de conteneur.
  - type: dnf
    repos:
      copr:
        - atim/starship
        - ilyaz/LACT
    install:
      packages:
        - starship
        - lact
        - gparted
        - papirus-icon-theme
        - gnome-initial-setup
    # Retrait ciblé, vérifié sur la base RPM de bazzite-gnome 45.20261104 :
    #   - ce qui tourne, se charge au démarrage ou s'affiche à l'écran sans servir sur cette machine ;
    #   - les firmwares Intel/Nvidia (place disque) ;
    #   - les bibliothèques propres à un composant retiré (orphelines). Les bibliothèques et outils
    #     génériques restent (rsync, wget2, dnsmasq, D-Bus, Qt, icônes Breeze…).
    # Les paquets inertes sont conservés : chacun retiré ici est un nom que Bazzite peut renommer,
    # ce qui ferait échouer le build. Aucun paquet conservé ne dépend d'un paquet de cette liste
    # (dnf remove retirerait sinon ces dépendants).
    remove:
      # Ne retirer que les paquets listés : un nettoyage automatique des dépendances emporterait
      # aussi des paquets utilisés sans dépendance RPM déclarée (dbus-broker, rsync, pciutils…).
      auto-remove: false
      packages:
        # --- Android / Waydroid (service waydroid-container actif) ---
        - waydroid
        - waydroid-selinux
        - libgbinder
        - python3-gbinder
        # Conteneurs LXC utilisés uniquement par Waydroid
        - lxc
        - lxc-libs
        - lxc-templates
        - lxcfs

        # --- Applications visibles non désirées ---
        - lutris
        - python3-moddb
        - python3-pypresence
        - webapp-manager
        - yelp
        - yelp-libs
        - yelp-xsl
        # cardwire (gestion multi-GPU, fournit switcheroo-control requis par gnome-shell) est conservé :
        # le Ryzen 9800X3D a un iGPU en plus de la Radeon. Seule son interface graphique est retirée.
        - cardwire-gui

        # --- Ancien gestionnaire de mises à jour (remplacé par ujust bazzora-update) ---
        # et KDE Frameworks qu'il est seul à utiliser
        - bazzite-updater
        - kf6-breeze-icons
        - kf6-kcolorscheme
        - kf6-kconfig
        - kf6-kcoreaddons
        - kf6-kcrash
        - kf6-kglobalaccel
        - kf6-kguiaddons
        - kf6-ki18n
        - kf6-kiconthemes
        - kf6-kirigami
        - kf6-kirigami-addons
        - kf6-kquickcharts
        - kf6-kwidgetsaddons
        - kf6-qqc2-desktop-style
        - kf6-sonnet
        - qqc2-breeze-style
        - qt6-controllable

        # --- Shell Fish (remplacé par Bash + bash-completion + Starship) ---
        - fish

        # --- Intégrations Steam Deck et extras GNOME visibles ---
        - gnome-shell-extension-user-theme
        - steamdeck-gnome-presets
        - steamdeck-backgrounds
        - gnome-search-yafti
        - jupiter-sd-mounting-btrfs

        # --- Firmwares et pilotes Intel / Nvidia (place disque, machine 100 % AMD) ---
        - nvidia-gpu-firmware
        - intel-gpu-firmware
        - intel-npu-firmware
        - intel-vsc-firmware
        - intel-audio-firmware
        - intel-opencl
        - intel-gmmlib
        - intel-igc
        - intel-igc-libs
        - intel-mediasdk
        - intel-opencl-clang
        - intel-vaapi-driver
        - intel-vpl-gpu-rt
        - libva-intel-media-driver
        # LLVM 22, conservé par Fedora 45 uniquement pour la pile OpenCL Intel (Mesa utilise LLVM 23)
        - llvm22-libs
        - llvm22-filesystem
        - clang22-libs
        - clang22-resource-filesystem
        - lld22-libs
        - spirv-llvm-translator22
        # Service intel_lpmd activé (gestion d'énergie des CPU Intel)
        - intel-lpmd

        # --- Agents de machines virtuelles (services activés, inutiles en bare-metal) ---
        - open-vm-tools
        - open-vm-tools-desktop
        - virtualbox-guest-additions
        - hyperv-daemons
        - hypervkvpd
        - hypervvssd
        - hypervfcopyd
        - qemu-guest-agent
        - spice-vdagent
        - spice-webdavd

        # --- Modules chargés au démarrage pour du matériel absent ---
        - system76-driver
        - system76-io
        - kmod-system76-driver
        - kmod-system76-io
        - gcadapter_oc
        - kmod-gcadapter_oc
        - kvmfr
        - kmod-kvmfr

        # --- Périphériques Razer (non utilisés) ---
        - openrazer
        - kmod-openrazer

        # --- Accessibilité, braille et synthèse vocale (non utilisés) ---
        - brltty
        - brlapi
        - python3-brlapi
        - orca
        - espeak-ng
        - speech-dispatcher
        - speech-dispatcher-espeak-ng

  # 3. Services systemd : démon LACT natif + verrouillage de l'administration web Cockpit
  - type: systemd
    system:
      enabled:
        - lactd.service
      # Masqués même si les paquets sont absents : empêche toute réactivation (ujust, container, layering)
      masked:
        - cockpit.socket
        - cockpit.service

  # 4. Exécution du script de debloat complet GNOME & wallpapers
  - type: script
    scripts:
      - debloat.sh

  # 5. Polices Nerd Fonts pour le terminal et les invites de commande
  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode
        - JetBrainsMono
        - Hack

  # 6. Flatpaks par défaut (écosystème épuré)
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        install:
          # --- Applications GNOME de base ---
          - org.gnome.Calculator
          - org.gnome.Calendar
          - org.gnome.Characters
          - org.gnome.clocks
          - org.gnome.Logs
          - org.gnome.Maps
          - org.gnome.Weather
          - org.gnome.baobab
          - org.gnome.Papers
          - org.gnome.NautilusPreviewer
          - org.gnome.font-viewer
          - org.gnome.Showtime
          - org.gnome.TextEditor
          - org.gnome.Loupe
          - org.gnome.SimpleScan
          # --- Outils système & utilitaires ---
          - io.missioncenter.MissionCenter
          - page.tesk.Refine
          - it.mijorus.gearlever
          - io.github.flattool.Warehouse
          - com.mattjakeman.ExtensionManager
          - com.github.tchx84.Flatseal
          # --- Navigateur ---
          - org.mozilla.firefox
          # --- Gaming & Lanceurs ---
          - com.heroicgameslauncher.hgl
          - io.github.Faugus.faugus-launcher
          - com.vysp3r.ProtonPlus
          - io.github.benjamimgois.goverlay

  # 7. Intégration des commandes ujust personnalisées (60-bazzora.just)
  - type: justfiles

  # 8. Signature de l'image
  - type: signing

name: bazzora
description: Image Bazzite-GNOME debloatée et optimisée pour PC Gaming Full AMD.
base-image: ghcr.io/ublue-os/bazzite-gnome
image-version: latest

# Les builds sont publiés sous le tag « candidate » uniquement.
# Le workflow CI les teste, puis promeut l'image validée en « latest » (voir .github/workflows/build.yml).
alt-tags:
  - candidate

modules:
  # 1. Copie des configurations et fichiers personnalisés (/etc, /usr, environment.d, etc.)
  - type: files
    files:
      - source: system
        destination: /

  # 2. Paquets RPM : ajout de Starship, LACT, GParted, Papirus ; retrait ciblé
  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/atim/starship/repo/fedora-%OS_VERSION%/atim-starship-fedora-%OS_VERSION%.repo
      - https://copr.fedorainfracloud.org/coprs/ilyaz/LACT/repo/fedora-%OS_VERSION%/ilyaz-LACT-fedora-%OS_VERSION%.repo
    install:
      - starship
      - lact
      - gparted
      - papirus-icon-theme
      - gnome-initial-setup
    # Retrait ciblé : uniquement ce qui tourne, se charge au démarrage ou s'affiche à l'écran
    # dans Bazzite (vérifié sur bazzite-gnome 44.20261023), plus les firmwares Intel/Nvidia.
    # Les paquets inertes (pilotes de matériel absent, outils non activés) sont conservés :
    # chacun retiré ici est un paquet de plus que Bazzite peut renommer et faire échouer le build.
    remove:
      # --- Android / Waydroid (service waydroid-container actif) ---
      - waydroid
      - waydroid-selinux
      - libgbinder
      - python3-gbinder

      # --- Applications visibles non désirées ---
      - lutris
      - makemkv
      - webapp-manager
      - yelp
      - bazzite-updater
      # cardwire (gestion multi-GPU, fournit switcheroo-control requis par gnome-shell) est conservé :
      # le Ryzen 9800X3D a un iGPU en plus de la Radeon. Seule son interface graphique est retirée.
      - cardwire-gui

      # --- Shell Fish (remplacé par Bash + bash-completion + Starship) ---
      - fish

      # --- Intégrations Steam Deck et extras GNOME visibles ---
      - gnome-shell-extension-user-theme
      - steamdeck-gnome-presets
      - steamdeck-backgrounds
      - gnome-search-yafti
      - gnome-rounded-blur
      - jupiter-sd-mounting-btrfs

      # --- Firmwares et pilotes Intel / Nvidia (place disque, machine 100 % AMD) ---
      - nvidia-gpu-firmware
      - intel-gpu-firmware
      - intel-npu-firmware
      - intel-vsc-firmware
      - intel-audio-firmware
      - intel-opencl
      - intel-gmmlib
      - intel-igc
      - intel-igc-libs
      - intel-mediasdk
      - intel-opencl-clang
      - intel-vaapi-driver
      - intel-vpl-gpu-rt
      - libva-intel-media-driver
      # Service intel_lpmd activé (gestion d'énergie des CPU Intel)
      - intel-lpmd

      # --- Agents de machines virtuelles (services activés, inutiles en bare-metal) ---
      - open-vm-tools
      - open-vm-tools-desktop
      - virtualbox-guest-additions
      - hyperv-daemons
      - hypervkvpd
      - hypervvssd
      - hypervfcopyd
      - qemu-guest-agent
      - spice-vdagent
      - spice-webdavd

      # --- Modules chargés au démarrage pour du matériel absent ---
      - system76-driver
      - system76-io
      - kmod-system76-driver
      - kmod-system76-io
      - gcadapter_oc
      - kmod-gcadapter_oc
      - kvmfr
      - kmod-kvmfr

      # --- Périphériques Razer (non utilisés) ---
      - openrazer
      - kmod-openrazer

      # --- Accessibilité, braille et synthèse vocale (non utilisés) ---
      - brltty
      - brlapi
      - python3-brlapi
      - orca
      - espeak-ng
      - speech-dispatcher
      - speech-dispatcher-espeak-ng

  # 3. Services systemd : démon LACT natif + verrouillage de l'administration web Cockpit
  - type: systemd
    system:
      enabled:
        - lactd.service
      # Masqués même si les paquets sont absents : empêche toute réactivation (ujust, container, layering)
      masked:
        - cockpit.socket
        - cockpit.service

  # 4. Exécution du script de debloat complet GNOME & wallpapers
  - type: script
    scripts:
      - debloat.sh

  # 5. Polices Nerd Fonts pour le terminal et les invites de commande
  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode
        - JetBrainsMono
        - Hack

  # 6. Flatpaks par défaut (écosystème épuré)
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        install:
          # --- Applications GNOME de base ---
          - org.gnome.Calculator
          - org.gnome.Calendar
          - org.gnome.Characters
          - org.gnome.clocks
          - org.gnome.Logs
          - org.gnome.Maps
          - org.gnome.Weather
          - org.gnome.baobab
          - org.gnome.Papers
          - org.gnome.NautilusPreviewer
          - org.gnome.font-viewer
          - org.gnome.Showtime
          - org.gnome.TextEditor
          - org.gnome.Loupe
          - org.gnome.SimpleScan
          # --- Outils système & utilitaires ---
          - io.missioncenter.MissionCenter
          - page.tesk.Refine
          - it.mijorus.gearlever
          - io.github.flattool.Warehouse
          - com.mattjakeman.ExtensionManager
          - com.github.tchx84.Flatseal
          # --- Navigateur ---
          - org.mozilla.firefox
          # --- Gaming & Lanceurs ---
          - com.heroicgameslauncher.hgl
          - io.github.Faugus.faugus-launcher
          - com.vysp3r.ProtonPlus
          - io.github.benjamimgois.goverlay

  # 7. Intégration des commandes ujust personnalisées (60-bazzora.just)
  - type: justfiles

  # 8. Signature de l'image
  - type: signing

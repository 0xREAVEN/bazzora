name: bazzora
description: Image Bazzite-GNOME debloatée et optimisée pour PC Gaming Full AMD.
base-image: ghcr.io/ublue-os/bazzite-gnome
image-version: latest

modules:
  # 1. Copie des configurations et fichiers personnalisés (/etc, /usr, environment.d, etc.)
  - type: files
    files:
      - source: system
        destination: /

  # 2. Gestion des paquets RPM (Ajout de Starship, LACT, GParted, Papirus et suppression bloat)
  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/atim/starship/repo/fedora-%OS_VERSION%/atim-starship-fedora-%OS_VERSION%.repo
      - https://copr.fedorainfracloud.org/coprs/ilyaz/LACT/repo/fedora-%OS_VERSION%/ilyaz-LACT-fedora-%OS_VERSION%.repo
    install:
      - starship
      - lact
      - gparted
      - papirus-icon-theme
      - gnome-initial-setup
    remove:
      # --- Émulation Android & Waydroid ---
      - waydroid
      - waydroid-selinux
      - libgbinder
      - python3-gbinder

      # --- Lanceurs non désirés ---
      - lutris

      # --- Shell Fish (remplacé par Bash + bash-completion + Starship) ---
      - fish

      # --- Extensions GNOME paquetées en RPM (les autres sont retirées par debloat.sh) ---
      - gnome-shell-extension-user-theme

      # --- Démons lourds & gestionnaires de snapshots (Gain RAM & CPU) ---
      - bees
      - snapper
      - btrfs-assistant

      # --- Microcodes & Pilotes Intel / Nvidia (Machine 100% AMD) ---
      - nvidia-gpu-firmware
      - intel-gpu-firmware
      - intel-npu-firmware
      - intel-vsc-firmware
      - intel-audio-firmware
      - intel-opencl
      - intel-gmmlib
      - intel-igc
      - intel-igc-libs
      - intel-lpmd
      - intel-mediasdk
      - intel-opencl-clang
      - intel-vaapi-driver
      - intel-vpl-gpu-rt
      - libva-intel-media-driver

      # --- Hyperviseurs & Machines Virtuelles (Inutiles en bare-metal) ---
      - open-vm-tools
      - open-vm-tools-desktop
      - virtualbox-guest-additions
      - hyperv-daemons
      - hypervkvpd
      - hypervvssd
      - hypervfcopyd
      - qemu-guest-agent
      - spice-vdagent
      - spice-webdavd

      # --- Matériel non AMD & Spécificités laptop/APU mobile non requises ---
      - framework-system
      - fw-ectool
      - fw-fanctrl
      - ryzenadj
      - kmod-system76-driver
      - kmod-system76-io
      - system76-driver
      - system76-io

      # --- Périphériques Razer, volants de course & matériel exotique ---
      - openrazer
      - kmod-openrazer
      - hid-fanatecff
      - kmod-hid-fanatecff
      - hid-fanatecff-akmod-modules
      - hid-tmff2
      - kmod-hid-tmff2
      - hid-tmff2-akmod-modules
      - t150-driver
      - kmod-t150-driver
      - new-lg4ff
      - kmod-new-lg4ff
      - new-lg4ff-akmod-modules
      - oversteer-udev
      - kmod-evdi
      - libevdi
      - kmod-wl
      - broadcom-wl
      - b43-fwcutter
      - b43-openfwwf
      - kmod-gcadapter_oc
      - gcadapter_oc
      - kmod-kvmfr
      - kvmfr

      # --- Contrôleurs exotiques et TV HDMI-CEC non requis ---
      - xwiimote-ng
      - ds-inhibit
      - linux-cec
      - inputattach-cec-units
      - libcec

      # --- Accessibilité, Braille & Synthèse vocale ---
      - brltty
      - brlapi
      - python3-brlapi
      - orca
      - espeak-ng
      - speech-dispatcher
      - speech-dispatcher-espeak-ng

      # --- Capteur biométrique (Inutile sur tour de bureau) ---
      - fprintd
      - fprintd-pam

      # --- Outils serveurs web Cockpit (inutiles sur PC gamer de bureau) ---
      - cockpit-bridge
      - cockpit-system
      - cockpit-podman
      - cockpit-networkmanager
      - cockpit-selinux
      - cockpit-files
      - cockpit-storaged

      # --- Ripping multimédia (libbluray conservé car requis par gvfs/Nautilus & FFmpeg) ---
      - makemkv

      # --- Intégrations Steam Deck, Yafti et presets GNOME superflus ---
      - steamdeck-gnome-presets
      - steamdeck-backgrounds
      - gnome-search-yafti
      - gnome-rounded-blur
      - jupiter-sd-mounting-btrfs

      # --- Réalité Virtuelle (VR) & Capture de streaming (openxr-libs conservé pour qt6) ---
      - openxr
      - obs-studio-plugin-vkcapture-hook-libs

      # --- Applications & Utilitaires superflus ---
      - cardwire
      - cardwire-gui
      - webapp-manager
      - cage
      - gmodpatchtool
      - yelp
      - bazzite-updater

  # 3. Services systemd : démon LACT natif + verrouillage de l'administration web Cockpit
  - type: systemd
    system:
      enabled:
        - lactd.service
      # Masqués même si les paquets sont absents : empêche toute réactivation (ujust, container, layering)
      masked:
        - cockpit.socket
        - cockpit.service

  # 4. Exécution du script de debloat complet GNOME & wallpapers
  - type: script
    scripts:
      - debloat.sh

  # 5. Polices Nerd Fonts pour le terminal et les invites de commande
  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode
        - JetBrainsMono
        - Hack

  # 6. Flatpaks par défaut (écosystème épuré)
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        install:
          # --- Applications GNOME de base ---
          - org.gnome.Calculator
          - org.gnome.Calendar
          - org.gnome.Characters
          - org.gnome.clocks
          - org.gnome.Logs
          - org.gnome.Maps
          - org.gnome.Weather
          - org.gnome.baobab
          - org.gnome.Papers
          - org.gnome.NautilusPreviewer
          - org.gnome.font-viewer
          - org.gnome.Showtime
          - org.gnome.TextEditor
          - org.gnome.Loupe
          - org.gnome.SimpleScan
          # --- Outils système & utilitaires ---
          - io.missioncenter.MissionCenter
          - page.tesk.Refine
          - it.mijorus.gearlever
          - io.github.flattool.Warehouse
          - com.mattjakeman.ExtensionManager
          - com.github.tchx84.Flatseal
          # --- Navigateur ---
          - org.mozilla.firefox
          # --- Gaming & Lanceurs ---
          - com.heroicgameslauncher.hgl
          - io.github.Faugus.faugus-launcher
          - com.vysp3r.ProtonPlus
          - io.github.benjamimgois.goverlay

  # 7. Intégration des commandes ujust personnalisées (60-bazzora.just)
  - type: justfiles

  # 8. Signature de l'image
  - type: signing

# --- Cache de shaders Mesa / RADV ---
# Conserve les shaders compilés au-delà de la limite Mesa par défaut (1 Go) : moins de recompilations.
MESA_SHADER_CACHE_MAX_SIZE=50G

# NTSYNC n'a pas besoin de variable : Proton-GE l'active de lui-même dès que /dev/ntsync existe
# (module chargé au démarrage par Bazzite). PROTON_USE_NTSYNC et PROTON_ENABLE_AMD_AGS ne sont lues
# ni par Proton (Valve) ni par Proton-GE ; AMD_VULKAN_ICD ne sert qu'avec AMDVLK, absent de l'image.

# Curseur de souris universel (XWayland / applications X11)
# XCURSOR_PATH n'est pas redéfini : le chemin par défaut (~/.icons, /usr/share/icons, pixmaps) est conservé.
# Les Flatpaks reçoivent leur propre chemin via /var/lib/flatpak/overrides/global.
XCURSOR_THEME=Bibata-Modern-Ice

# --- Optimisations Mesa / RADV Shader Cache ---
# Empêche l'éviction des shaders compilés dans les gros jeux AAA (évite les micro-stutters)
MESA_SHADER_CACHE_MAX_SIZE=50G

# Force l'utilisation du pilote Vulkan RADV (Mesa ACO)
AMD_VULKAN_ICD=RADV

# Active le support AMD GPU Services (AGS) sous Proton (FidelityFX / FSR)
PROTON_ENABLE_AMD_AGS=1

# Active la synchronisation noyau Windows NT (NTSYNC) pour améliorer les 1% low FPS
PROTON_USE_NTSYNC=1

# Curseur de souris universel (XWayland / applications X11)
# XCURSOR_PATH n'est pas redéfini : le chemin par défaut (~/.icons, /usr/share/icons, pixmaps) est conservé.
# Les Flatpaks reçoivent leur propre chemin via /var/lib/flatpak/overrides/global.
XCURSOR_THEME=Bibata-Modern-Ice

# Arguments envoyés à gamescope
SCB_GAMESCOPE_ARGS="-f --force-grab-cursor --mangoapp"

# Utiliser automatiquement les propriétés de ton écran principal
SCB_AUTO_RES=1   # -W / -H = résolution actuelle de l'écran
SCB_AUTO_HDR=0   # Désactivé sous GNOME (Mutter gère mieux le HDR via PROTON_ENABLE_WAYLAND=1)
SCB_AUTO_VRR=1   # ajoute --adaptive-sync si VRR activé

# Prérequis d'Easy Anti-Cheat Linux v2 (vérifié par « ujust check-anticheat ») :
# kexec désactivé, plus de démarrage d'un autre noyau sans redémarrer la machine.
# Réglage à sens unique : il ne peut plus être remis à 0 avant le redémarrage suivant.
# Appliqué par systemd-sysctl : SELinux interdit à systemd-tmpfiles d'écrire dans /proc/sys/kernel.
kernel.kexec_load_disabled = 1

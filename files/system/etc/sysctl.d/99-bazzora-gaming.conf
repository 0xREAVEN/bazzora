# Déjà fournis par Bazzite, non redéfinis ici :
#   vm.max_map_count = 2147483642     (/usr/lib/sysctl.d/70-gaming.conf)
#   net.ipv4.tcp_congestion_control = bbr (/usr/lib/sysctl.d/75-networking.conf)
#   ZRAM zstd                         (/etc/systemd/zram-generator.conf)

# --- Mémoire virtuelle & ZRAM (Valeurs CachyOS / SteamOS) ---
vm.swappiness = 100
vm.page-cluster = 0
vm.vfs_cache_pressure = 50

# --- Cache d'écriture disque (évite les freezes I/O pendant un jeu) ---
# Le profil d'énergie « performance » reprend ces valeurs (profil tuned throughput-performance-bazzora).
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
vm.dirty_writeback_centisecs = 1500

# --- Ordonnanceur ---
# kernel.sched_rt_runtime_us est laissé à la valeur par défaut du noyau (jamais -1) : une tâche temps réel
# bloquée ne peut pas geler la machine. PipeWire obtient sa priorité via rtkit.
# Les détecteurs de blocage (nmi_watchdog, sp5100_tco) restent actifs comme sur Bazzite :
# « ujust configure-watchdog » permet de les désactiver.

# --- Réseau (pacing FQ, complète le BBR de Bazzite) ---
net.core.netdev_max_backlog = 4096
net.core.default_qdisc = fq

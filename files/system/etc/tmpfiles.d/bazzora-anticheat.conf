# Prérequis d'Easy Anti-Cheat Linux v2 (vérifié par « ujust check-anticheat »), appliqué à chaque démarrage.
# L'autre prérequis géré par Bazzora, kexec désactivé, est dans /etc/sysctl.d/99-bazzora-anticheat.conf.
# Appliqué ici plutôt qu'en argument noyau (bootc kargs.d) : « rpm-ostree upgrade », utilisé par
# « ujust bazzora-update », n'applique pas les arguments noyau déclarés par l'image.
#
# Lockdown « integrity » : interdit de modifier le noyau en cours d'exécution (modules non signés,
# /dev/mem, registres MSR, hibernation). Sans effet sur LACT, qui passe par le sysfs d'amdgpu.
# Le mode ne peut qu'être durci jusqu'au redémarrage suivant.
# « - » : pas d'erreur si le noyau est déjà dans un mode plus strict (confidentiality).
w- /sys/kernel/security/lockdown - - - - integrity

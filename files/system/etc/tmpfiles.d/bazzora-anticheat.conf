# Prérequis d'Easy Anti-Cheat Linux v2 (vérifiés par « ujust check-anticheat »), appliqués à chaque démarrage.
# Les deux réglages ne peuvent qu'être durcis jusqu'au redémarrage suivant.
# Appliqués ici plutôt qu'en arguments noyau (bootc kargs.d) : « rpm-ostree upgrade », utilisé par
# « ujust bazzora-update », n'applique pas les arguments noyau déclarés par l'image.
#
# Lockdown « integrity » : interdit de modifier le noyau en cours d'exécution (modules non signés,
# /dev/mem, registres MSR, hibernation). Sans effet sur LACT, qui passe par le sysfs d'amdgpu.
# « - » : pas d'erreur si le noyau est déjà dans un mode plus strict (confidentiality).
w- /sys/kernel/security/lockdown - - - - integrity
# Kexec désactivé : plus de démarrage d'un autre noyau sans redémarrer la machine.
w /proc/sys/kernel/kexec_load_disabled - - - - 1

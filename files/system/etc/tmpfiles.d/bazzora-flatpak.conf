# Overrides Flatpak globaux (accès aux thèmes de curseur/icônes de l'hôte).
# /var n'est pas mis à jour par rpm-ostree lors d'un rebase : la copie est faite au démarrage.
# « C » ne copie que si la cible n'existe pas (les réglages de l'utilisateur sont préservés).
d /var/lib/flatpak/overrides 0755 root root -
C /var/lib/flatpak/overrides/global 0644 root root - /usr/share/bazzora/flatpak/overrides-global

#
# tuned configuration
#
# Profil « performance » de Bazzora : celui de Bazzite (throughput-performance-bazzite),
# sans le dirty_bytes = 40 % de la RAM hérité de throughput-performance, qui remplacerait
# les valeurs de /etc/sysctl.d/99-bazzora-gaming.conf. Associé au mode « performance »
# de power-profiles par debloat.sh (/etc/tuned/ppd.conf).

[main]
summary=Bazzite performance profile keeping Bazzora disk write-back limits
include=throughput-performance-bazzite

[vm]
dirty_bytes=268435456
dirty_background_bytes=67108864

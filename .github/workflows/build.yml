name: bluebuild
on:
  schedule:
    - cron: "00 06 * * *" # tous les jours à 06:00 UTC, après la publication des images Bazzite
  # Les branches de travail sont construites par leur PR : un push ne lance un build que sur main
  push:
    branches:
      - main
    paths-ignore: # pas de build si seule la documentation change
      - "**.md"
  pull_request:
  workflow_dispatch:
concurrency:
  # Un seul build à la fois par branche ou PR
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  # En minuscules : les noms d'images OCI n'acceptent pas de majuscules (0xREAVEN → 0xreaven)
  IMAGE: ghcr.io/0xreaven/bazzora

# Chaîne de publication sécurisée :
#   1. build    → construit et signe l'image, publiée uniquement sous des tags « candidate »
#                 (alt-tags du recipe.yml) : « latest » n'est jamais touché à ce stade.
#   2. test     → tests de fumée sur l'image candidate (bootc, ujust, paquets, services,
#                 configurations, signature Cosign).
#      boot     → installation de la candidate sur un disque virtuel et démarrage dans
#                 QEMU/KVM jusqu'à l'invite de connexion.
#   3. promote  → uniquement sur main et si les tests et le démarrage passent : la candidate
#                 (même digest, donc même signature) devient « latest ».
# En cas d'échec, les utilisateurs restent sur la dernière image « latest » validée.
jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Construction et signature (BlueBuild)
        uses: blue-build/github-action@24d146df25adc2cf579e918efe2d9bff6adea408 # v1.11.1
        with:
          recipe: recipe.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # Libère l'espace disque du runner avant le build (image de 8 Go)
          maximize_build_space: true

          # Découpage de l'image en couches stables (rpm-ostree compose build-chunked-oci) :
          # une mise à jour ne télécharge que les couches modifiées.
          build_chunked_oci: true

  test:
    name: Tests de l'image candidate
    needs: bluebuild
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.candidate.outputs.digest }}
      os_version: ${{ steps.candidate.outputs.os_version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Libération d'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost || true
          df -h /

      - name: Connexion au registre
        run: echo "${{ github.token }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Localisation de l'image candidate
        id: candidate
        run: |
          set -euo pipefail
          SHA7="${GITHUB_SHA:0:7}"
          if ! TAGS=$(skopeo list-tags "docker://${IMAGE}" | jq -r '.Tags[]'); then
            echo "::error::Impossible de lister les tags de ${IMAGE}"
            exit 1
          fi
          # Tags posés par BlueBuild pour ce commit : « <sha>-candidate-<version Fedora> » attendu
          DU_COMMIT=$(grep -E "^${SHA7}-" <<<"$TAGS" || true)
          TAG=$(grep -E "^${SHA7}-candidate-[0-9]+$" <<<"$DU_COMMIT" | head -n1 || true)
          if [ -z "$TAG" ]; then
            echo "::error::Aucune image candidate pour ${SHA7}. Tags du commit : $(tr '\n' ' ' <<<"${DU_COMMIT:-aucun}") | Derniers tags : $(tail -n 8 <<<"$TAGS" | tr '\n' ' ')"
            exit 1
          fi
          DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE}:${TAG}")
          echo "Image candidate : ${IMAGE}:${TAG} (${DIGEST})"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "os_version=${TAG##*-}" >> "$GITHUB_OUTPUT"
          # Image de base de la recette, utilisée pour distinguer les défauts hérités des régressions
          BASE=$(yq -r '.["base-image"] + ":" + .["image-version"]' recipes/recipe.yml)
          echo "base_image=${BASE}" >> "$GITHUB_OUTPUT"

      - name: Installation de Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Vérification de la signature Cosign
        run: cosign verify --key cosign.pub "${IMAGE}@${{ steps.candidate.outputs.digest }}" > /dev/null

      - name: Téléchargement de l'image
        run: podman pull -q "${IMAGE}@${{ steps.candidate.outputs.digest }}"

      - name: Tests de fumée
        run: .github/scripts/test-image.sh "${IMAGE}@${{ steps.candidate.outputs.digest }}" "${{ steps.candidate.outputs.base_image }}"

  boot:
    name: Démarrage en machine virtuelle
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      DIGEST: ${{ needs.test.outputs.digest }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Libération d'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost || true
          sudo docker system prune --all --force > /dev/null || true
          df -h / /mnt

      - name: Installation de QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 > /dev/null
          if [ ! -e /dev/kvm ]; then
            echo "::error::KVM indisponible sur ce runner"
            exit 1
          fi

      - name: Téléchargement de l'image
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull -q "${IMAGE}@${DIGEST}"

      - name: Installation sur un disque virtuel
        # Installation réelle par bootc (comme sur une machine), sur un fichier disque dans /mnt
        # (disque temporaire du runner). La console série sert à suivre le démarrage.
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/vm
          sudo truncate -s 40G /mnt/vm/disk.raw
          sudo podman run --rm --privileged --pid=host \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers:/var/lib/containers -v /dev:/dev -v /mnt/vm:/output \
            "${IMAGE}@${DIGEST}" \
            bootc install to-disk --generic-image --via-loopback --skip-fetch-check \
              --filesystem btrfs --karg console=tty0 --karg console=ttyS0,115200n8 \
              /output/disk.raw

      - name: Démarrage
        run: .github/scripts/boot-test.sh /mnt/vm/disk.raw serial.log

      - name: Journal de la console série
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: console-serie
          path: serial.log
          if-no-files-found: ignore
          retention-days: 7

  promote:
    name: Publication en « latest »
    needs: [test, boot]
    # Seuls les builds de main sont publiés (pas les PR ni les autres branches)
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Promotion de l'image validée
        env:
          DIGEST: ${{ needs.test.outputs.digest }}
          OS_VERSION: ${{ needs.test.outputs.os_version }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y%m%d)
          REPO="${IMAGE#ghcr.io/}"
          # Retag direct par l'API du registre : le manifeste validé est republié octet pour octet,
          # le digest ne change pas et la signature Cosign reste valide. (skopeo copy --preserve-digests
          # refuse désormais de réécrire l'index OCI qui contient l'attestation de build.)
          TOKEN=$(curl -fsS -u "${REGISTRY_USER}:${REGISTRY_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${REPO}:pull,push" | jq -r .token)
          curl -fsS -D headers.txt -o manifest.json -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${REPO}/manifests/${DIGEST}"
          TYPE=$(grep -i '^content-type:' headers.txt | cut -d' ' -f2 | tr -d '\r')
          if [ "sha256:$(sha256sum manifest.json | cut -d' ' -f1)" != "${DIGEST}" ]; then
            echo "::error::Le manifeste récupéré ne correspond pas au digest validé ${DIGEST}"
            exit 1
          fi
          for TAG in latest "${OS_VERSION}" "${DATE}" "${DATE}-${OS_VERSION}"; do
            curl -fsS -X PUT -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: ${TYPE}" \
              --data-binary @manifest.json "https://ghcr.io/v2/${REPO}/manifests/${TAG}" > /dev/null
            PUBLIE=$(curl -fsS -I -H "Authorization: Bearer ${TOKEN}" -H "Accept: ${TYPE}" \
              "https://ghcr.io/v2/${REPO}/manifests/${TAG}" | grep -i '^docker-content-digest:' | cut -d' ' -f2 | tr -d '\r')
            if [ "${PUBLIE}" != "${DIGEST}" ]; then
              echo "::error::${IMAGE}:${TAG} pointe sur ${PUBLIE:-rien}, ${DIGEST} attendu"
              exit 1
            fi
            echo "✅ ${IMAGE}:${TAG} → ${DIGEST}"
          done
          echo "### 🚀 Image publiée" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${IMAGE}:latest\` → \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

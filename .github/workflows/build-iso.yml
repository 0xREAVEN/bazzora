name: Build Installer ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    name: Build Bazzora Installer ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version Fedora de la recette
        id: fedora
        run: |
          set -euo pipefail
          # image-version (« stable-45 ») est la seule source de la version Fedora
          TAG=$(yq -r '.["image-version"]' recipes/recipe.yml)
          VERSION="${TAG##*-}"
          if ! [[ "${VERSION}" =~ ^[0-9]+$ ]]; then
            echo "::error::image-version « ${TAG} » ne contient pas de version Fedora (attendu : stable-<N>)"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Free Disk Space (Runner & Docker)
        run: |
          echo "=== Espace disque initial ==="
          df -h /
          echo "=== Nettoyage des caches Docker ==="
          sudo docker system prune --all --force --volumes || true
          echo "=== Nettoyage des runtimes lourds (.NET, Android, Haskell, Boost, CodeQL) ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          echo "=== Nettoyage des caches paquets et utilisateur ==="
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/* /var/cache/dnf/* /var/cache/* /home/runner/.cache/* || true
          echo "=== Espace disque après nettoyage ==="
          df -h /

      - name: Build Container Installer ISO
        uses: jasonn3/build-container-installer@bed71f841c250650a70f1ed8315ba92da1591ba6 # v1.5.0
        id: build
        with:
          arch: x86_64
          image_name: bazzora
          image_repo: ghcr.io/0xreaven
          image_tag: latest
          version: ${{ steps.fedora.outputs.version }}
          variant: Silverblue
          iso_name: bazzora-latest.iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazzora-latest-iso
          path: |
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}-CHECKSUM
          if-no-files-found: error
          retention-days: 7

      - name: Split ISO for GitHub Releases (Bypass 2GB Limit)
        run: |
          cd "${{ steps.build.outputs.iso_path }}"
          echo "=== Découpage de l'ISO en morceaux de 1900 Mo pour respecter la limite GitHub de 2 Go ==="
          split -b 1900M --numeric-suffixes=1 -a 2 "${{ steps.build.outputs.iso_name }}" "${{ steps.build.outputs.iso_name }}.part"
          echo "=== Fichiers prêts pour la Release ==="
          ls -lh "${{ steps.build.outputs.iso_name }}"*

      - name: Installation de Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Signature de la somme de contrôle
        # Même clé que l'image (secret SIGNING_SECRET, clé publique cosign.pub) : la somme de contrôle
        # prouve que l'ISO est intacte, la signature qu'elle vient bien de ce dépôt.
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          CHECKSUM: ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}-CHECKSUM
        run: |
          set -euo pipefail
          cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY --bundle "${CHECKSUM}.sigstore.json" "${CHECKSUM}"
          # Contrôle immédiat avec la clé publique du dépôt : une signature invalide bloque la publication
          cosign verify-blob --key cosign.pub --bundle "${CHECKSUM}.sigstore.json" "${CHECKSUM}"

      - name: Publish ISO to GitHub Releases
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: latest
          name: "Bazzora Installer ISO (Latest)"
          draft: false
          prerelease: false
          body: |
            ## 🚀 Bazzora Installer ISO (Dernière version)

            Image ISO amorçable prête à l'emploi pour **Bazzora** (PC Desktop Gaming Full AMD).

            ### 📦 Assembler l'ISO après téléchargement (Recombine Split Parts)
            En raison de la limite stricte de **2 Go par fichier** imposée par GitHub, l'image est découpée en parties de 1,9 Go.
            Téléchargez l'ensemble des fichiers (`.part01`, `.part02`, `.part03`, etc.), le fichier `-CHECKSUM` et sa signature `-CHECKSUM.sigstore.json` dans le même dossier, puis exécutez la commande correspondante :

            * **Linux / macOS (Terminal) :**
              ```bash
              cat bazzora-latest.iso.part* > bazzora-latest.iso
              # Authenticité : la somme de contrôle est signée avec la clé du dépôt (cosign.pub)
              cosign verify-blob --key cosign.pub --bundle bazzora-latest.iso-CHECKSUM.sigstore.json bazzora-latest.iso-CHECKSUM
              # Intégrité : l'ISO reconstituée correspond à la somme de contrôle signée
              sha256sum -c bazzora-latest.iso-CHECKSUM
              ```

            * **Windows (Invite de commandes CMD) :**
              ```cmd
              copy /b bazzora-latest.iso.part* bazzora-latest.iso
              ```

            * **Windows (PowerShell) :**
              ```powershell
              cmd /c copy /b bazzora-latest.iso.part* bazzora-latest.iso
              Get-FileHash bazzora-latest.iso -Algorithm SHA256
              ```

            ### 💿 Flash sur clé USB
            Flashez ensuite le fichier `bazzora-latest.iso` reconstitué sur une clé USB avec [Ventoy](https://www.ventoy.net/) ou [BalenaEtcher](https://etcher.balena.io/).
          files: |
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}.part*
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}-CHECKSUM
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}-CHECKSUM.sigstore.json

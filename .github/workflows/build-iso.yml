name: Build Installer ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    name: Build Bazzora Installer ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space (Runner & Docker)
        run: |
          echo "=== Espace disque initial ==="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune --all --force --volumes
          echo "=== Espace disque après nettoyage ==="
          df -h /

      - name: Build Container Installer ISO
        uses: jasonn3/build-container-installer@main
        id: build
        with:
          arch: x86_64
          image_name: bazzora
          image_repo: ghcr.io/0xreaven
          image_tag: latest
          version: 44
          variant: Silverblue
          iso_name: bazzora-latest.iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bazzora-latest-iso
          path: |
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}-CHECKSUM
          if-no-files-found: error
          retention-days: 7
